# SCUM 附近物品栏截图区域（屏幕绝对坐标）：左上角 (372,53)，右下角 (595,753)
nearbyX=372
nearbyY=53
nearbyWidth=223
nearbyHeight=700

# 新截图区域按 6 行 4 列遍历；每个半透明小格是一个物品槽位
rows=12
cols=4
slotWidth=52
slotHeight=54
slotGapX=4
slotGapY=2

# 不同物品在槽位内的垂直位置不同，分别设置裁剪偏移
panIconOffsetX=4
panIconOffsetY=14
stoneFireIconOffsetX=4
stoneFireIconOffsetY=18
riceIconOffsetX=6
riceIconOffsetY=3
waterIconOffsetX=10
waterIconOffsetY=2
cornIconOffsetX=7
cornIconOffsetY=6
fishIconOffsetX=4
fishIconOffsetY=10

# 在基准偏移周围搜索 ±1 像素，解决游戏图标轻微位移造成的相似度骤降
positionSearchRadius=1

# classpath: 表示从 src/main/resources（打包后为 JAR 内资源）读取
panTemplatePath=classpath:/image/pan.png
stoneFireTemplatePath=classpath:/image/stoneFire.png
riceTemplatePath=classpath:/image/rice.png
waterTemplatePath=classpath:/image/water.png
cornTemplatePath=classpath:/image/corn.png
fishTemplatePath=classpath:/image/fish.png

# 四种物品分别校准阈值
panSimilarityThreshold=0.900
stoneFireSimilarityThreshold=0.900
riceSimilarityThreshold=0.900
waterSimilarityThreshold=0.920
cornSimilarityThreshold=0.920
fishSimilarityThreshold=0.920

# xiuli repair-menu template detection area: top-left (720,640), bottom-right (738,766)
xiuliSearchX=720
xiuliSearchY=640
xiuliSearchWidth=18
xiuliSearchHeight=126
xiuliTemplatePath=classpath:/image/xiuli.jpg
xiuliSimilarityThreshold=0.930

# RegionTemplateDetector returns the template center in absolute screen coordinates.
xiuliResultOffsetX=0
xiuliResultOffsetY=0

# drink-once menu template area: top-left (870,241), inclusive bottom-right (895,313)
drinkOnceSearchX=870
drinkOnceSearchY=241
drinkOnceSearchWidth=26
drinkOnceSearchHeight=73
drinkOnceTemplatePath=classpath:/image/drinkOnce.jpg
drinkOnceSimilarityThreshold=0.930

# Returned coordinates are the center of the matched template.
drinkOnceResultOffsetX=0
drinkOnceResultOffsetY=0

# case/fridge detection area: top-left (376,176), bottom-right (665,236)
caseSearchX=376
caseSearchY=176
caseSearchWidth=289
caseSearchHeight=60
caseTemplatePath=classpath:/image/case.jpg
caseSimilarityThreshold=0.930
caseResultOffsetX=0
caseResultOffsetY=0

fridgeSearchX=376
fridgeSearchY=176
fridgeSearchWidth=289
fridgeSearchHeight=60
fridgeTemplatePath=classpath:/image/fridge.jpg
fridgeSimilarityThreshold=0.930
fridgeResultOffsetX=0
fridgeResultOffsetY=0

# Dynamic destroy-menu area relative to the detected case/fridge coordinate.
# Top-left = (screenX + searchX, screenY + searchY), size = 100x150.
destroySearchX=0
destroySearchY=0
destroySearchWidth=100
destroySearchHeight=150
destroyTemplatePath=classpath:/image/destroy.jpg
destroySimilarityThreshold=0.930
destroyResultOffsetX=0
destroyResultOffsetY=0
